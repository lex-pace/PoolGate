[package]
name = "poolgate"
version = "0.1.0"
description = "Local Agent Gateway — unified account pool management"
authors = ["PoolGate Team"]
license = "MIT"
repository = "https://github.com/lex-pace/PoolGate"
homepage = "https://github.com/lex-pace/PoolGate"
edition = "2021"

[lib]
name = "poolgate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
window-vibrancy = "0.6"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "socks"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
futures = "0.3"
bytes = "1"
headers = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
ring = "0.17"
url = "2"
regex = "1.13.1"
# 局域网 IP 探测（监听地址设置：localhost / 0.0.0.0 时向同事展示可达地址）
local-ip-address = "0.6"
# ==== token_monitor deps ====
# async-trait: QuotaConnector 异步 trait 方案（07 §8 已拍板，00 §9 登记）
async-trait = "0.1"
# notify: W2 采集框架的文件监听（05 规范；W0 预置，注册见 04 共享文件清单）
notify = "6"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3.27.0"
